apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  labels:
    app.kubernetes.io/name: website
spec:
  ingressClassName: nginx
  rules:
    - host: website.apps.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  name: http
