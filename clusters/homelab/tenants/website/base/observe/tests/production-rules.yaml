          "labels": {
            "tenant": "website",
            "env": "dev",
            "namespace": "website-dev",
            "slo": "availability"
          }
        },
        {
          "record": "gp:slo_error_ratio:rate30m",
          "expr": "((sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\",status=~\"5..\"}[30m]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\",status=~\"5..\"}[30m])) or (0 * sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\"}[30m]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[30m])))) / sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\"}[30m]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[30m]))) and (sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\"}[30m]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[30m])) > 0)",
          "labels": {
            "tenant": "website",
            "env": "dev",
            "namespace": "website-dev",
            "slo": "availability"
          }
        },
        {
          "record": "gp:slo_error_ratio:rate1h",
          "expr": "((sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\",status=~\"5..\"}[1h]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\",status=~\"5..\"}[1h])) or (0 * sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\"}[1h]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[1h])))) / sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\"}[1h]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[1h]))) and (sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\"}[1h]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[1h])) > 0)",
          "labels": {
            "tenant": "website",
