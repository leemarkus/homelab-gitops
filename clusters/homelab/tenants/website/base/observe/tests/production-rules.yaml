        {
          "record": "gp:slo_error_ratio:rate3d",
          "expr": "((sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\",status=~\"5..\"}[3d]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\",status=~\"5..\"}[3d])) or (0 * sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\"}[3d]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[3d])))) / sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\"}[3d]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[3d]))) and (sum(rate(nginx_ingress_controller_requests{exported_namespace=\"website-dev\",ingress=\"website\"}[3d]) or rate(nginx_ingress_controller_requests{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[3d])) > 0)",
          "labels": {
            "tenant": "website",
            "env": "dev",
            "namespace": "website-dev",
            "slo": "availability"
          }
        }
      ]
    },
    {
      "name": "website-dev-latency",
      "interval": "30s",
      "rules": [
        {
          "record": "gp:slo_error_ratio:rate5m",
          "expr": "(1 - sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace=\"website-dev\",ingress=\"website\",le=\"0.5\"}[5m]) or rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\",le=\"0.5\"}[5m])) / sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[5m]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[5m]))) and (sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[5m]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[5m])) > 0)",
          "labels": {
            "tenant": "website",
            "env": "dev",
            "namespace": "website-dev",
            "slo": "latency"
          }
        },
        {
          "record": "gp:slo_error_ratio:rate30m",
          "expr": "(1 - sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace=\"website-dev\",ingress=\"website\",le=\"0.5\"}[30m]) or rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\",le=\"0.5\"}[30m])) / sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[30m]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[30m]))) and (sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[30m]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[30m])) > 0)",
          "labels": {
            "tenant": "website",
            "env": "dev",
            "namespace": "website-dev",
            "slo": "latency"
          }
        },
        {
          "record": "gp:slo_error_ratio:rate1h",
          "expr": "(1 - sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace=\"website-dev\",ingress=\"website\",le=\"0.5\"}[1h]) or rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\",le=\"0.5\"}[1h])) / sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[1h]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[1h]))) and (sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[1h]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[1h])) > 0)",
          "labels": {
            "tenant": "website",
            "env": "dev",
            "namespace": "website-dev",
            "slo": "latency"
          }
        },
        {
          "record": "gp:slo_error_ratio:rate2h",
          "expr": "(1 - sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace=\"website-dev\",ingress=\"website\",le=\"0.5\"}[2h]) or rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\",le=\"0.5\"}[2h])) / sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[2h]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[2h]))) and (sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[2h]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[2h])) > 0)",
          "labels": {
            "tenant": "website",
            "env": "dev",
            "namespace": "website-dev",
            "slo": "latency"
          }
        },
        {
          "record": "gp:slo_error_ratio:rate6h",
          "expr": "(1 - sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace=\"website-dev\",ingress=\"website\",le=\"0.5\"}[6h]) or rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\",le=\"0.5\"}[6h])) / sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[6h]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[6h]))) and (sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[6h]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[6h])) > 0)",
          "labels": {
            "tenant": "website",
            "env": "dev",
            "namespace": "website-dev",
            "slo": "latency"
          }
        },
        {
          "record": "gp:slo_error_ratio:rate1d",
          "expr": "(1 - sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace=\"website-dev\",ingress=\"website\",le=\"0.5\"}[1d]) or rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\",le=\"0.5\"}[1d])) / sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[1d]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[1d]))) and (sum(rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace=\"website-dev\",ingress=\"website\"}[1d]) or rate(nginx_ingress_controller_request_duration_seconds_count{namespace=\"website-dev\",exported_namespace=\"\",ingress=\"website\"}[1d])) > 0)",
          "labels": {
            "tenant": "website",
            "env": "dev",
            "namespace": "website-dev",
