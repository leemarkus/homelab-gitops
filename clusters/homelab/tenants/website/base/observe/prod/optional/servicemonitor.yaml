{
  "apiVersion": "monitoring.coreos.com/v1",
  "kind": "ServiceMonitor",
  "metadata": {
    "name": "website-metrics",
    "namespace": "website-prod",
    "labels": {
      "app.kubernetes.io/name": "website",
      "tenant": "website",
      "env": "prod",
      "release": "kube-prometheus-stack"
    }
  },
  "spec": {
    "namespaceSelector": {
      "matchNames": [
        "website-prod"
      ]
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "website",
        "golden-path/metrics": "enabled"
      }
    },
    "endpoints": [
      {
        "port": "metrics",
        "path": "/metrics",
        "interval": "30s",
        "scrapeTimeout": "10s",
        "honorLabels": false
      }
    ]
  }
}
