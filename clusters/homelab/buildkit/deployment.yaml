# Rootless BuildKit for CI image builds, reachable only from the runner
# namespace. Strategy Recreate: the cache volume is ReadWriteOnce.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: ci
  labels:
    app.kubernetes.io/name: buildkitd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
        app.kubernetes.io/name: buildkitd
      annotations:
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
          imagePullPolicy: IfNotPresent
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            - --oci-worker-gc
            - --oci-worker-gc-keepstorage
            - "15000000000"
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: 3000m, memory: 4Gi}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: buildkit-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
  namespace: ci
  labels:
    app.kubernetes.io/name: buildkitd
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: ci
  labels:
    app.kubernetes.io/name: buildkitd
spec:
  type: ClusterIP
  selector:
    app: buildkitd
  ports:
    - name: buildkit
      port: 1234
      targetPort: 1234
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkitd-ingress
  namespace: ci
spec:
  podSelector:
    matchLabels:
      app: buildkitd
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: forgejo-runner
      ports:
        - protocol: TCP
          port: 1234
