---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
  labels:
    app.kubernetes.io/name: k3s-server-upgrade
spec:
  version: v1.34.12+k3s1
  concurrency: 1
  jobActiveDeadlineSecs: 2400
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  serviceAccountName: system-upgrade
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists
  cordon: true
  drain:
    force: true
    skipWaitForDeleteTimeout: 60
    deleteEmptydirData: true
    ignoreDaemonSets: true
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
  labels:
    app.kubernetes.io/name: k3s-agent-upgrade
spec:
  version: v1.34.12+k3s1
  concurrency: 1
  jobActiveDeadlineSecs: 2400
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: NotIn
        values: ["true"]
  serviceAccountName: system-upgrade
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  cordon: true
  drain:
    force: true
    skipWaitForDeleteTimeout: 60
    deleteEmptydirData: true
    ignoreDaemonSets: true
  upgrade:
    image: rancher/k3s-upgrade
