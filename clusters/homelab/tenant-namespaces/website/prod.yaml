apiVersion: v1
kind: Namespace
metadata:
  name: website-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: website
    app.kubernetes.io/part-of: homelab
    golden-path/managed-by: platform
    golden-path/tenant: website
    golden-path/environment: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.34
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.34
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: website-quota
  namespace: website-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: website-quota
    app.kubernetes.io/part-of: homelab
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    pods: "10"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: website-container-limits
  namespace: website-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: website-container-limits
    app.kubernetes.io/part-of: homelab
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
