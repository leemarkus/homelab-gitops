apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-alertmanager-page
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ntfy-alertmanager-page
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-alertmanager-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy-alertmanager-page
      annotations:
        checksum/config: "homelab-page-tiers-20260801"
    spec:
      containers:
        - name: ntfy-alertmanager
          image: docker.io/xenrox/ntfy-alertmanager:1.0.1
          args: ["--config", "/etc/ntfy-alertmanager/config"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy-alertmanager
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: ntfy-alertmanager-config-page
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-alertmanager-page
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ntfy-alertmanager-page
spec:
  selector:
    app.kubernetes.io/name: ntfy-alertmanager-page
  ports:
    - name: http
      port: 8080
      targetPort: http
