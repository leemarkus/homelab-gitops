---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: human-readonly-cluster-scope
  labels:
    app.kubernetes.io/name: human-readonly-cluster-scope
    app.kubernetes.io/part-of: cluster-config
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes, namespaces, componentstatuses]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments, csidrivers, csinodes, csistoragecapacities]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, roles, rolebindings]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets, appprojects]
    verbs: [get, list, watch]
  - apiGroups: [longhorn.io]
    resources: ['*']
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io, acme.cert-manager.io]
    resources: ['*']
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: ['*']
    verbs: [get, list, watch]
  - apiGroups: [kyverno.io, wgpolicyk8s.io, reports.kyverno.io]
    resources: ['*']
    verbs: [get, list, watch]
  - apiGroups: [cilium.io]
    resources: ['*']
    verbs: [get, list, watch]
  - apiGroups: [velero.io]
    resources: ['*']
    verbs: [get, list, watch]
  - apiGroups: [upgrade.cattle.io]
    resources: ['*']
    verbs: [get, list, watch]
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: human-readonly-view-operator
  labels:
    app.kubernetes.io/name: human-readonly-view-operator
    app.kubernetes.io/part-of: cluster-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: human-readonly-cluster-operator
  labels:
    app.kubernetes.io/name: human-readonly-cluster-operator
    app.kubernetes.io/part-of: cluster-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: human-readonly-cluster-scope
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: operator
