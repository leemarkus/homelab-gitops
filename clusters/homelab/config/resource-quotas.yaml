apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: default
  labels:
    app.kubernetes.io/name: default-quota
    app.kubernetes.io/part-of: homelab
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 8Gi
    pods: "20"
    persistentvolumeclaims: "4"
    requests.storage: 20Gi
