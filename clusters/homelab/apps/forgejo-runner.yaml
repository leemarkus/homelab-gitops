apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://git.example.com/platform/gitops.git
    targetRevision: deploy
    path: clusters/homelab/forgejo-runner
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo-runner
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: forgejo-runner
      namespace: forgejo-runner
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
