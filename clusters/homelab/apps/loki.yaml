apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.30.1
      helm:
        valueFiles:
          - $values/clusters/homelab/values/loki-values.yaml
    - repoURL: https://git.example.com/platform/gitops.git
      targetRevision: deploy
      ref: values
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: loki
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].spec.volumeMode | select(. == "Filesystem")
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
