apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 2
      timeout: 1h
      shutdown_timeout: 30s
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      labels:
        - "docker:host"
        - "ubuntu-latest:host"
        - "ubuntu-22.04:host"
    cache:
      enabled: false
    container:
      network: ""
      privileged: false
      options:
      workdir_parent:
      valid_volumes: []
      docker_host: ""
      force_pull: false
    host:
      workdir_parent: /data/workdir
