# Run: python3 tests/prometheus/run.py (extracts the actual PrometheusRule spec).
# New backtest cases use 100 fsyncs/s on node-3 and a healthy peer at 100x.
# One-minute samples: a full 6h/1h selector spans 359/59 counter increments.
# Typical night starts at 16:30; spike increments are (22:30,23:30] and (01:30,02:30].
# Worst night: hourly 7.1%/4%/3% spikes; 1.9% between spikes is synthetic,
# chosen to match the observed ~3.3% 6h maximum, not reconstruct a raw trace.
rule_files:
- etcd-rules.yaml
evaluation_interval: 1m
tests:
- name: 10m flapping survives the old hold-reset failure; healthy peer cannot dilute
  interval: 1m
  input_series:
  - series: etcd_disk_wal_fsync_duration_seconds_bucket{instance="node-3",le="+Inf"}
    values: 0+100x130
  - series: etcd_disk_wal_fsync_duration_seconds_bucket{instance="node-3",le="0.016"}
    values: 0+80x10 900+100x9 1880+80x9 2700+100x9 3680+80x9 4500+100x9 5480+80x9 6300+100x9 7280+80x9 8100+100x9 9080+80x9
      9900+100x9 10880+80x9
  - series: etcd_disk_wal_fsync_duration_seconds_bucket{instance="node-1",le="+Inf"}
    values: 0+10000x130
  - series: etcd_disk_wal_fsync_duration_seconds_bucket{instance="node-1",le="0.016"}
    values: 0+10000x130
  promql_expr_test:
  - expr: ALERTS{alertname=~"EtcdWalFsync(Slow|Critical)",alertstate="firing"}
    eval_time: 60m
    exp_samples:
    - labels: ALERTS{alertname="EtcdWalFsyncSlow",alertstate="firing",instance="node-3",severity="warning"}
      value: 1
    - labels: ALERTS{alertname="EtcdWalFsyncCritical",alertstate="firing",instance="node-3",severity="critical"}
      value: 1
  - expr: ALERTS{alertname=~"EtcdWalFsync(Slow|Critical)",alertstate="firing"}
    eval_time: 65m
    exp_samples:
    - labels: ALERTS{alertname="EtcdWalFsyncSlow",alertstate="firing",instance="node-3",severity="warning"}
      value: 1
    - labels: ALERTS{alertname="EtcdWalFsyncCritical",alertstate="firing",instance="node-3",severity="critical"}
      value: 1
  - expr: ALERTS{alertname=~"EtcdWalFsync(Slow|Critical)",alertstate="firing"}
    eval_time: 70m
    exp_samples:
    - labels: ALERTS{alertname="EtcdWalFsyncSlow",alertstate="firing",instance="node-3",severity="warning"}
      value: 1
    - labels: ALERTS{alertname="EtcdWalFsyncCritical",alertstate="firing",instance="node-3",severity="critical"}
      value: 1
  - expr: ALERTS{alertname=~"EtcdWalFsync(Slow|Critical)",alertstate="firing"}
    eval_time: 75m
    exp_samples:
    - labels: ALERTS{alertname="EtcdWalFsyncSlow",alertstate="firing",instance="node-3",severity="warning"}
      value: 1
    - labels: ALERTS{alertname="EtcdWalFsyncCritical",alertstate="firing",instance="node-3",severity="critical"}
      value: 1
  - expr: ALERTS{alertname=~"EtcdWalFsync(Slow|Critical)",alertstate="firing"}
    eval_time: 80m
    exp_samples:
    - labels: ALERTS{alertname="EtcdWalFsyncSlow",alertstate="firing",instance="node-3",severity="warning"}
      value: 1
    - labels: ALERTS{alertname="EtcdWalFsyncCritical",alertstate="firing",instance="node-3",severity="critical"}
      value: 1
  - expr: ALERTS{alertname=~"EtcdWalFsync(Slow|Critical)",alertstate="firing"}
    eval_time: 90m
    exp_samples:
    - labels: ALERTS{alertname="EtcdWalFsyncSlow",alertstate="firing",instance="node-3",severity="warning"}
      value: 1
    - labels: ALERTS{alertname="EtcdWalFsyncCritical",alertstate="firing",instance="node-3",severity="critical"}
      value: 1
  - expr: ALERTS{alertname=~"EtcdWalFsync(Slow|Critical)",alertstate="firing"}
    eval_time: 100m
